name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the leading v"
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_exists: ${{ steps.release.outputs.exists }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check GitHub release
        id: release
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "GitHub release $TAG already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "GitHub release $TAG does not exist"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: prepare

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'packages/*/package.json') }}-prepare-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'packages/*/package.json') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release versions
        run: bun run verify:release --version ${{ steps.version.outputs.version }}

      - name: Check TypeScript
        run: bun run checktypes

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Package Rust crates
        run: cargo package -p fatima-engine

  publish-crates:
    name: Publish crates.io
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish fatima-engine
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if cargo search fatima-engine --limit 1 --color never | grep -q "^fatima-engine = \"$VERSION\""; then
            echo "fatima-engine $VERSION already published, skipping"
          else
            cargo publish -p fatima-engine
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish fatima-cli
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if cargo search fatima-cli --limit 1 --color never | grep -q "^fatima-cli = \"$VERSION\""; then
            echo "fatima-cli $VERSION already published, skipping"
          else
            cargo publish -p fatima-cli
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.release_exists != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-latest
          - target: linux-x64-musl
            runner: ubuntu-latest
          - target: linux-arm64-musl
            runner: ubuntu-latest
          - target: darwin-x64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: ubuntu-latest
          - target: windows-x64
            runner: ubuntu-latest
          - target: windows-arm64
            runner: ubuntu-latest
          - target: wasm
            runner: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
          cache-on-failure: true

      - name: Restore Docker build dependencies
        id: cache-docker-build
        if: matrix.target != 'linux-x64' && matrix.target != 'wasm'
        uses: actions/cache/restore@v4
        with:
          path: target/fatima-build-cache
          key: ${{ runner.os }}-docker-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-docker-build-${{ matrix.target }}-
            ${{ runner.os }}-docker-build-

      - name: Setup wasm-pack
        if: matrix.target == 'wasm'
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build binary archive
        run: cargo run -p task -- build-binaries --target ${{ matrix.target }}

      - name: Inspect release outputs
        shell: bash
        run: |
          pwd
          ls -la
          ls -la .release || true
          ls -la .release/raw || true
          find .release -maxdepth 3 -type f -print || true

      - name: Save Docker build dependencies
        if: always() && matrix.target != 'linux-x64' && matrix.target != 'wasm' && steps.cache-docker-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/fatima-build-cache
          key: ${{ steps.cache-docker-build.outputs.cache-primary-key }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatima-${{ matrix.target }}
          path: |
            .release/*.zip
            .release/*.tar.gz
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload WASM npm artifact
        if: matrix.target == 'wasm'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-npm
          path: |
            .release/raw/wasm-pack/fatima_wasm.js
            .release/raw/wasm-pack/fatima_wasm.d.ts
            .release/raw/wasm/fatima_wasm_bg.wasm
          if-no-files-found: error
          include-hidden-files: true

  publish-npm:
    name: Publish npm
    needs:
      - prepare
      - build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'packages/*/package.json') }}-publish-npm-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'packages/*/package.json') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download WASM build artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-npm
          path: .release/raw

      - name: Publish @fatima.dev/js
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if npm view "@fatima.dev/js@$VERSION" version >/dev/null 2>&1; then
            echo "@fatima.dev/js $VERSION already published, skipping"
          else
            bun run publish:npm
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  github-release:
    name: Publish GitHub release
    needs:
      - prepare
      - build-binaries
    if: needs.prepare.outputs.release_exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fatima-*
          path: .release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          gh release create "$TAG" .release-assets/* --title "Fatima v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-static:
    name: Upload static files
    needs:
      - prepare
      - github-release
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.release_exists == 'true' || needs.github-release.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Upload static files to S3-compatible storage
        run: |
          cargo run -p task -- upload-static \
            --version "${{ needs.prepare.outputs.version }}" \
            --versioned-policy missing \
            --aliases always
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.R2_REGION || 'auto' }}
