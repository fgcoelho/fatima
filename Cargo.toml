[workspace]
members = ["crates/cli", "crates/engine", "crates/wasm", "crates/task"]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Fgc17/fatima"
description = "Safe secrets and environment management for JavaScript and Rust projects"

[workspace.dependencies]
fatima-engine = { path = "crates/engine", version = "0.0.1", default-features = false }
async-trait = "0.1"
clap = { version = "4.6.1", features = ["derive", "env", "wrap_help"] }
futures = "0.3"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
aes-gcm = "0.10"
base64 = "0.22"
indicatif = { version = "0.18.4", default-features = false, features = ["unicode-width"] }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm", "fuzzy"] }
miette = { version = "7.6", features = ["fancy-no-backtrace"] }
rand = "0.8"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
serde_yaml = "0.9"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
crossterm = "0.29"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3
